server:
  port: 51100

spring:
  application:
    name: movie-service
  datasource:
    url: jdbc:postgresql://localhost:5432/moviedb
    username: admin
    password: password  # Asegurate de ajustar esto segun tu local
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:50003 # URL de tu auth-service
